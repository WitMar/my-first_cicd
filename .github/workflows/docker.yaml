    name: Build and Push Docker Image

    on:
      workflow_run:
        workflows: ["Build and Test"]   # Nazwa workflow zdefiniowana w build.yml
        types:
          - completed                   # Uruchom po zakończeniu workflow
        branches: [main]

    jobs:
      docker:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Uruchom tylko jeśli testy przeszły

        steps:
          - name: Checkout repozytorium
            uses: actions/checkout@v3

          - name: Login to GitHub Container Registry
            uses: docker/login-action@v2
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Build Docker image
            run: docker build -t ghcr.io/${{ github.repository }}:latest . #Kropka oznacza, że Dockerfile jest w katalogu głównym repozytorium

          - name: Push Docker image
            run: docker push ghcr.io/${{ github.repository }}:latest
